version: 2

project_name: jig

before:
  hooks:
    - go mod tidy

builds:
  - id: jig
    main: ./main.go
    binary: jig
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/voxpupuli/jig/v2/commands.version={{ .Version }}

archives:
  - id: default
    ids:
      - jig
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - id: packages
    ids:
      - jig
    package_name: jig
    formats:
      - deb
      - rpm
    vendor: Vox Pupuli
    homepage: https://github.com/voxpupuli/jig
    maintainer: Vox Pupuli <voxpupuli@groups.io>
    description: >-
      A Go-based reimplementation of the Puppet Development Kit (PDK), built
      to be fast, self-contained, and free of Ruby runtime dependencies.
    license: GPL-3.0-or-later
    contents:
      - src: LICENSE
        dst: /usr/share/doc/jig/LICENSE

checksum:
  name_template: sha256sums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
